name: Build website from Sanity

on:
  push:
    branches: [vercel-sanity-integration, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wissen-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build published content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Prepare build
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check page links and security regressions
        run: npm run check
      - name: Generate website and published articles
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
      - name: Check generated website references
        run: python scripts/check-site.py --dist
      - name: Store portable website
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wissen-website
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Explain publishing status
        run: |
          echo '### Website build ready' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the wissen-website artifact for the generated website and Sanity articles.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Hosting is not configured. This workflow builds files but does not publish a live website.' >> "$GITHUB_STEP_SUMMARY"
